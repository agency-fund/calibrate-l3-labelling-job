<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get your labelling job</title>
<style>
  :root { color-scheme: light; --bg: #fff; --fg: #111; --line: #999; }
  @media (prefers-color-scheme: dark) {
    :root { color-scheme: dark; --bg: #111; --fg: #eee; --line: #555; }
  }
  :root[data-theme="light"] { color-scheme: light; --bg: #fff; --fg: #111; --line: #999; }
  :root[data-theme="dark"] { color-scheme: dark; --bg: #111; --fg: #eee; --line: #555; }
  body {
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    margin: 0; padding: 32px 20px; display: flex; justify-content: center;
    background: var(--bg); color: var(--fg);
  }
  main { width: 100%; max-width: 420px; }
  h1 { font-size: 22px; margin: 0 0 24px; }
  label { display: block; font-weight: 600; margin: 20px 0 6px; }
  select, input, button, .start {
    width: 100%; box-sizing: border-box; font: inherit;
    padding: 12px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--fg);
  }
  #theme {
    position: fixed; top: 12px; right: 12px; width: auto; margin: 0;
    padding: 6px 10px; font-size: 14px; line-height: 1;
    background: var(--bg); color: var(--fg); border: 1px solid var(--line); cursor: pointer;
  }
  button, .start {
    margin-top: 28px; border: 0; background: #1a56db; color: #fff;
    font-weight: 600; cursor: pointer; text-align: center; text-decoration: none; display: block;
  }
  button:disabled { background: #999; cursor: not-allowed; }
  #message { margin-top: 20px; }
  #message.error { color: #b91c1c; }
  #link-text { font-size: 13px; word-break: break-all; opacity: .7; }
</style>
</head>
<body>
<button id="theme" type="button" title="Switch between dark and light"></button>

<main>
  <h1>Get your labelling job</h1>

  <label for="annotator">Your name</label>
  <select id="annotator"><option value="">Loading...</option></select>
  <input id="new-name" type="text" placeholder="Type your full name" hidden>

  <label for="task">Task</label>
  <select id="task"><option value="">Loading...</option></select>

  <button id="go" disabled>Get my labelling job</button>

  <p id="message"></p>

  <div id="result" hidden>
    <a id="link" class="start">Start labelling</a>
    <p id="link-text"></p>
  </div>
</main>

<script src="config.js"></script>
<script>
const cfg = window.CALIBRATE;
// On your own machine `vercel dev` serves the page and the proxy together, so
// the proxy is at this same address and the deployed one in config.js is not
// used.
const apiBase = ["localhost", "127.0.0.1"].includes(location.hostname) ? "/api" : cfg.apiBase;
const el = (id) => document.getElementById(id);
const annotatorSelect = el("annotator");
const newName = el("new-name");
const taskSelect = el("task");
const goButton = el("go");

let annotators = [];
let labellingUrl = "";

async function callApi(path, body) {
  const response = await fetch(apiBase + path, {
    method: body ? "POST" : "GET",
    headers: body ? { "Content-Type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  const text = await response.text();
  let data;
  try { data = JSON.parse(text); } catch { data = text; }
  if (!response.ok) {
    const detail = data && data.detail !== undefined ? data.detail : text;
    throw new Error(typeof detail === "string" ? detail : JSON.stringify(detail));
  }
  return data;
}

function fill(select, options, placeholder) {
  select.innerHTML = "";
  select.append(new Option(placeholder, ""));
  for (const [value, label] of options) select.append(new Option(label, value));
}

function showMessage(text, isError) {
  const message = el("message");
  message.textContent = text;
  message.className = isError ? "error" : "";
}

function plainReason(error) {
  const text = String(error.message || error);
  if (error instanceof TypeError) return "Could not reach the proxy. Check it is running, and check apiBase in config.js.";
  if (text.includes("no items selected")) return "This task has no items to label yet. Ask whoever set it up to add items.";
  if (text.includes("Not set on the server")) return text;
  if (text.includes("API key")) return "The server does not have a valid Calibrate API key.";
  if (text.includes("Not allowed")) return "The server address in config.js is wrong.";
  return text;
}

function validate() {
  const hasName = annotatorSelect.value === "new"
    ? newName.value.trim().length > 0
    : annotatorSelect.value !== "";
  goButton.disabled = !(hasName && taskSelect.value !== "");
}

async function load() {
  try {
    const [settings, people, tasks] = await Promise.all([
      callApi("/config"),
      callApi("/annotators"),
      callApi("/annotation-tasks?limit=1000"),
    ]);
    labellingUrl = settings.labellingUrl;
    annotators = people;
    fill(annotatorSelect, people.map((a) => [a.uuid, a.name]), "Select your name");
    annotatorSelect.append(new Option("My name is not here", "new"));
    fill(taskSelect, tasks.items.map((t) => [t.uuid, t.name]), "Select a task");
  } catch (error) {
    fill(annotatorSelect, [], "Could not load");
    fill(taskSelect, [], "Could not load");
    showMessage(plainReason(error), true);
  }
  validate();
}

async function findOrCreateAnnotator(name) {
  try {
    const created = await callApi("/annotators", { name });
    return created.uuid;
  } catch (error) {
    // The name is already taken, most likely by this same person on an
    // earlier visit. Re-read the list in case it was added after page load.
    annotators = await callApi("/annotators");
    const match = annotators.find((a) => a.name.toLowerCase() === name.toLowerCase());
    if (match) return match.uuid;
    throw error;
  }
}

async function assign() {
  goButton.disabled = true;
  el("result").hidden = true;
  showMessage("Working...");
  try {
    const taskId = taskSelect.value;
    const annotatorId = annotatorSelect.value === "new"
      ? await findOrCreateAnnotator(newName.value.trim())
      : annotatorSelect.value;

    const jobs = await callApi("/annotation-tasks/" + taskId + "/jobs");
    const existing = jobs.find((job) =>
      job.annotator_id === annotatorId && !String(job.public_token).startsWith("import:"));

    const token = existing
      ? existing.public_token
      : (await callApi("/annotation-tasks/" + taskId + "/jobs",
          { annotator_ids: [annotatorId], select_all: true })).jobs[0].public_token;

    const url = labellingUrl + token;
    el("link").href = url;
    el("link-text").textContent = url;
    el("result").hidden = false;
    showMessage(existing
      ? "You already have a job for this task. Here it is."
      : "Your labelling job is ready.");
  } catch (error) {
    showMessage(plainReason(error), true);
  }
  validate();
}

const themeButton = el("theme");
const systemTheme = () => (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
const currentTheme = () => document.documentElement.dataset.theme || systemTheme();

function setTheme(theme) {
  document.documentElement.dataset.theme = theme;
  localStorage.setItem("theme", theme);
  themeButton.textContent = theme === "dark" ? "Light" : "Dark";
}
setTheme(localStorage.getItem("theme") || systemTheme());
themeButton.addEventListener("click", () => setTheme(currentTheme() === "dark" ? "light" : "dark"));

annotatorSelect.addEventListener("change", () => {
  newName.hidden = annotatorSelect.value !== "new";
  if (!newName.hidden) newName.focus();
  validate();
});
newName.addEventListener("input", validate);
taskSelect.addEventListener("change", validate);
goButton.addEventListener("click", assign);

load();
</script>
</body>
</html>
